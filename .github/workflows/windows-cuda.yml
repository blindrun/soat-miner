# Builds the Windows CUDA binary that the Linux cross-build cannot produce
# (nvcc needs MSVC on a Windows host). The runner has no GPU, so this only
# COMPILES and checks the imports - it never mines. Real hashrate numbers come
# from running the binary on actual cards.
#
# The recipe here mirrors the one proven by hand on a real Windows box: a
# multi-arch fat binary (Turing/Ampere/Ada native + PTX for Hopper/Blackwell)
# with the CUDA runtime linked statically, so the .exe carries no cudart64 DLL.
# The only non-system dependency left is the VC++ runtime, which is bundled.
name: windows-cuda

on:
  workflow_dispatch: {}        # build + validate on demand

jobs:
  build:
    # Pinned, not windows-latest: latest now ships VS 2026 (MSVC 14.5x), newer
    # than any host compiler CUDA 12.6's nvcc will accept. windows-2022 has
    # VS 2022 (MSVC 14.4x), a supported pairing.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        id: cuda
        with:
          cuda: '12.6.0'
          method: 'network'
          # nvcc to compile, cudart for the static runtime lib. No VS
          # integration: the runner's default generator (VS 2026) has no CUDA
          # toolset for 12.6, so we drive nvcc directly through Ninja instead.
          sub-packages: '["nvcc", "cudart"]'

      # Puts cl.exe / the MSVC toolchain on PATH so Ninja + nvcc can find the
      # host compiler without the Visual Studio generator's .props integration.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build-rel -S . -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CUDA_ARCHITECTURES="75-real;86-real;89-real;90-virtual" `
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Static

      - name: Build
        run: cmake --build build-rel

      - name: Bundle VC++ runtime and stage the package
        shell: pwsh
        run: |
          $pkg = "cuda-pkg"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          # Ninja is single-config: the exe lands in build-rel, no Release subdir.
          Copy-Item build-rel\soat-miner.exe $pkg\ -Force
          foreach ($dll in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            $src = Get-ChildItem "C:\Windows\System32\$dll" -EA SilentlyContinue | Select-Object -First 1
            if ($src) { Copy-Item $src.FullName $pkg\ -Force } else { throw "missing $dll" }
          }
          # Fail loudly if cudart leaked back in as a dynamic dependency.
          $imports = & dumpbin /dependents "$pkg\soat-miner.exe"
          if ($imports -match 'cudart') { throw "cudart64 dynamically linked - static link failed" }
          Get-ChildItem $pkg | Select-Object Name,Length | Format-Table -AutoSize

      # The staged package (soat-miner.exe + the VC++ DLLs) is what the
      # Makefile's windows-package target folds into the full Windows zip
      # alongside the Linux-cross-built Vulkan binary. Download it from here.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: soat-miner-win64-cuda
          path: cuda-pkg/
